name: CPU toy and game-port tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build optional native C99 C5 kernel
        run: sh hq500m/native/build.sh
      - name: Test standalone CPU neural engine and local HTTP/JSON connectors
        run: python -m unittest discover -s tests -v
      - name: Smoke test on ordinary CPU
        run: |
          python -m hq500m demo --cells 128
          python -m hq500m query 499999999 > /dev/null
          python examples/simple_game.py
          python -m hq500m demo --engine paged --max-pages 8 --ticks 2
          python -m hq500m demo --engine paged --kernel native --max-pages 8 --ticks 2
          python -m hq500m demo --engine paged --kernel native --event-kernel native --lif-kernel native --max-pages 8 --ticks 2
          python -m hq500m demo --engine paged --max-pages 8 --ticks 2 --threshold 0.35
          python -m hq500m demo --engine paged --max-pages 8 --ticks 2 --plasticity-scope all_exc
          python -m hq500m demo --engine paged --dendrites --max-pages 8 --ticks 3
          python -m hq500m demo --engine bitweave --pages 1 --fanout 0 --ticks 2
